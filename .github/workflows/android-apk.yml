name: Build Tipid Kunuhay APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted

          # Find every .zip in the repo (any name, any folder)
          mapfile -d '' ZIPS < <(
            find . -type f -iname '*.zip' \
              -not -path './extracted/*' \
              -not -path './.git/*' \
              -not -path '*/node_modules/*' \
              -print0 | sort -z
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "ERROR: no .zip file found in the repository"
            exit 1
          fi

          # Extract each zip into its own numbered folder (avoids name clashes)
          i=0
          for z in "${ZIPS[@]}"; do
            i=$((i+1))
            echo "Extracting: $z -> extracted/$i"
            unzip -q -o "$z" -d "extracted/$i"
          done

          # Prefer a package.json that is a Capacitor project
          mapfile -t CANDIDATES < <(
            grep -rl --include=package.json --exclude-dir=node_modules \
              '@capacitor/core' extracted | sort
          )
          PACKAGE_JSON="${CANDIDATES[0]:-}"

          # Fallback: any package.json at all
          if [ -z "$PACKAGE_JSON" ]; then
            mapfile -t ANY < <(
              find extracted -name package.json -not -path '*/node_modules/*' | sort
            )
            PACKAGE_JSON="${ANY[0]:-}"
          fi

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json not found in any ZIP"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_JSON")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)"

          if [[ -z "$SDKMANAGER" ]]; then
            echo "sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          node --version
          npm --version
          npm install --no-audit --no-fund --legacy-peer-deps

      - name: Install compatible TypeScript
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install --no-save --no-audit --no-fund --legacy-peer-deps typescript@5.9.3

      - name: Generate Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run android:init

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TipidKunuhay-debug-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
